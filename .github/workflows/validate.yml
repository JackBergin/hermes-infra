name: Validate infrastructure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m py_compile scripts/hermesctl.py scripts/evaluate.py
      - name: Validate Compose shape
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Check for accidentally committed sensitive artifacts
        run: |
          ! git ls-files | grep -E '(^state/|^backups/|(^|/)\.env$|\.zip$)'
